<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin banque — Syllabes · Plouma</title>
<style>
  :root {
    --bg: #faf7f2; --carte: #ffffff; --encre: #2b2620; --doux: #8a8177;
    --accent: #e8b23a; --trait: #e8e2d8; --ok: #2f9e63; --ko: #d0533b;
    --syl-a: #2f9e63; --syl-b: #7b6bd0; --alerte: #d0843b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--encre); }
  header { padding: 24px 32px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  header h1 { margin: 0; font-size: 21px; }
  header nav a { color: var(--doux); font-size: 13px; }
  main { padding: 0 32px 60px; max-width: 980px; margin: 0 auto; }
  .onglets { display: flex; gap: 8px; margin-bottom: 16px; }
  .onglets button {
    padding: 9px 18px; border: 1px solid var(--trait); border-radius: 10px;
    background: var(--carte); font: inherit; font-weight: 600; cursor: pointer; color: var(--doux);
  }
  .onglets button.actif { background: var(--encre); color: #fff; border-color: var(--encre); }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 18px 20px; }
  button.action {
    padding: 10px 18px; border: none; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ko { background: #fbeae6; color: var(--ko); }
  .btn-neutre { background: var(--trait); color: var(--encre); }
  .btn-principal { background: var(--accent); color: var(--encre); }
  #etat-sauvegarde { font-size: 13px; color: var(--doux); }
  #etat-sauvegarde.erreur { color: var(--ko); font-weight: 700; }

  /* — mode correction — */
  .progression { height: 8px; background: var(--trait); border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
  .progression div { height: 100%; background: var(--ok); transition: width 0.3s; }
  .grand-mot { font-size: 44px; font-weight: 800; text-align: center; margin: 10px 0 2px; letter-spacing: 0.5px; }
  .grand-mot .s0 { color: var(--syl-a); } .grand-mot .s1 { color: var(--syl-b); }
  .fiche-infos { text-align: center; color: var(--doux); margin-bottom: 14px; }
  .boutons { display: flex; gap: 10px; justify-content: center; margin: 18px 0 6px; flex-wrap: wrap; }
  .fini { text-align: center; padding: 40px 0; color: var(--doux); font-size: 17px; }

  /* — formulaire — */
  form.item { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 14px; }
  form.item label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--doux); }
  form.item input, form.item select {
    padding: 8px 10px; border: 1px solid var(--trait); border-radius: 8px; font: inherit; background: #fff;
  }
  form.item .large { grid-column: 1 / -1; }
  fieldset { border: 1px solid var(--trait); border-radius: 8px; grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; padding: 10px 12px; }
  fieldset legend { font-size: 12.5px; color: var(--doux); padding: 0 4px; }
  fieldset label { flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--encre) !important; }

  /* — mode édition — */
  .barre { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .barre input[type=search] { padding: 9px 12px; border: 1px solid var(--trait); border-radius: 10px; font: inherit; background: var(--carte); flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--trait); font-size: 14px; }
  th { color: var(--doux); font-size: 12px; font-weight: 600; }
  tr:hover td { background: #faf7f2; cursor: pointer; }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; font-weight: 700; }
  .tag.valide { background: #e3f4ea; color: var(--ok); }
  .tag.a-relire { background: #fdf3e4; color: var(--alerte); }
  dialog { border: none; border-radius: 16px; padding: 22px 26px; max-width: 760px; width: 92vw; box-shadow: 0 20px 60px #0003; }
  dialog::backdrop { background: #2b262055; }
  dialog h3 { margin: 0; }
</style>
</head>
<body>
<header>
  <h1>🛠️ Admin banque — Syllabes</h1>
  <span id="etat-sauvegarde"></span>
  <nav><a href="./">← visualisation</a> · <a href="../../cadrage/simulateur/dashboard/">dashboard</a></nav>
</header>
<main>
  <div class="onglets">
    <button id="ong-correction" class="actif">✅ Mode correction</button>
    <button id="ong-edition">📝 Mode édition</button>
  </div>
  <section id="vue-correction"></section>
  <section id="vue-edition" hidden></section>
</main>

<dialog id="dlg"><div id="dlg-contenu"></div></dialog>

<script type="module">
const FICHIER = 'syllabes.csv';
const CLES = ['mot', 'syllabesOrales', 'decoupage', 'phonemeAttaque', 'frequence', 'competences', 'distracteursProches', 'aVerifier', 'statut'];

// ————— données —————
const [csvBrut, graphe] = await Promise.all([
  fetch(FICHIER).then((r) => r.text()),
  fetch('../graphe-competences.json').then((r) => r.json()),
]);
const COMPETENCES = graphe.modules.flatMap((m) => m.competences.map((c) => ({ id: c.id, nom: c.nom, module: m.nom })));
let items = csvBrut.trim().split('\n').slice(1)
  .map((l) => Object.fromEntries(l.split(';').map((v, i) => [CLES[i], v ?? ''])));

const etatSauvegarde = document.getElementById('etat-sauvegarde');
async function sauver() {
  const csv = [CLES.join(';'), ...items.map((it) => CLES.map((k) => (it[k] ?? '').replaceAll(';', ',')).join(';'))].join('\n');
  etatSauvegarde.textContent = 'sauvegarde…';
  etatSauvegarde.classList.remove('erreur');
  try {
    const r = await fetch('save', { method: 'POST', body: JSON.stringify({ fichier: FICHIER, csv }) });
    if (!(await r.json()).ok) throw new Error();
    etatSauvegarde.textContent = `✓ sauvegardé — ${items.filter((i) => i.statut === 'valide').length}/${items.length} validés`;
  } catch {
    etatSauvegarde.textContent = '⚠️ échec de sauvegarde (serveur npm start lancé ?)';
    etatSauvegarde.classList.add('erreur');
  }
}

// ————— helpers —————
const colore = (dec, cls = '') => dec.split('-').map((s, i) => `<span class="s${i % 2}">${s}</span>`).join('');
function formulaire(it, estNouveau = false) {
  const comps = new Set((it.competences ?? '').split('|').filter(Boolean));
  return `<form class="item">
    <label>mot<input name="mot" value="${it.mot ?? ''}" required ${estNouveau ? '' : 'readonly'}></label>
    <label>découpage (tirets, ex. la-pin)<input name="decoupage" value="${it.decoupage ?? ''}" required></label>
    <label>phonème d'attaque<input name="phonemeAttaque" value="${it.phonemeAttaque ?? ''}" required></label>
    <label>fréquence<select name="frequence">
      ${[1, 2, 3].map((f) => `<option value="${f}" ${String(f) === it.frequence ? 'selected' : ''}>${f} — ${['très fréquent', 'fréquent', 'plus rare'][f - 1]}</option>`).join('')}
    </select></label>
    <label>à vérifier (e caduc…)<select name="aVerifier">
      <option value="non" ${it.aVerifier === 'non' ? 'selected' : ''}>non</option>
      <option value="oui" ${it.aVerifier === 'oui' ? 'selected' : ''}>oui</option>
    </select></label>
    <label class="large">distracteurs proches (séparés par |)<input name="distracteursProches" value="${it.distracteursProches ?? ''}"></label>
    <fieldset><legend>compétences travaillées</legend>
      ${COMPETENCES.filter((c) => c.module === 'Syllabes').map((c) =>
        `<label><input type="checkbox" name="comp" value="${c.id}" ${comps.has(c.id) ? 'checked' : ''}>${c.nom}</label>`).join('')}
    </fieldset>
  </form>`;
}
function lireFormulaire(section, it) {
  const f = section.querySelector('form.item');
  if (!f.reportValidity()) return null;
  const d = new FormData(f);
  const maj = { ...it };
  for (const k of ['mot', 'decoupage', 'phonemeAttaque', 'frequence', 'aVerifier', 'distracteursProches']) maj[k] = String(d.get(k) ?? '').trim();
  maj.competences = [...f.querySelectorAll('input[name=comp]:checked')].map((c) => c.value).join('|');
  maj.syllabesOrales = String(maj.decoupage.split('-').length); // dérivé du découpage
  return maj;
}

// ————— mode correction : un mot à la fois —————
const vueCorrection = document.getElementById('vue-correction');
let fileCorrection = [];

function demarrerCorrection() {
  // à vérifier d'abord, puis le reste ; les « valide » ne réapparaissent jamais
  fileCorrection = items.filter((i) => i.statut !== 'valide')
    .sort((a, b) => (b.aVerifier === 'oui') - (a.aVerifier === 'oui'));
  rendreCorrection();
}

function rendreCorrection() {
  const total = items.length;
  const faits = total - fileCorrection.length;
  if (fileCorrection.length === 0) {
    vueCorrection.innerHTML = `<div class="carte fini">🎉 Tout est relu : ${total}/${total} mots validés.<br>
      <small>Les nouveaux mots ou les mots modifiés en édition reviendront ici.</small></div>`;
    return;
  }
  const it = fileCorrection[0];
  vueCorrection.innerHTML = `
    <div class="progression"><div style="width:${(faits / total) * 100}%"></div></div>
    <div class="carte">
      <div class="grand-mot">${colore(it.decoupage)}</div>
      <div class="fiche-infos">${it.syllabesOrales} syllabe(s) · attaque /${it.phonemeAttaque}/ · fréq. ${it.frequence}
        ${it.aVerifier === 'oui' ? ' · <b style="color:var(--alerte)">⚠️ découpage à vérifier</b>' : ''}<br>
        <small>compétences : ${it.competences.split('|').join(', ') || '—'} · distracteurs : ${it.distracteursProches.split('|').filter(Boolean).join(', ') || '—'}</small>
      </div>
      <div class="boutons">
        <button class="action btn-ok" id="btn-juste">✓ C'est juste</button>
        <button class="action btn-ko" id="btn-faux">✗ À corriger</button>
        <button class="action btn-neutre" id="btn-passer">Passer</button>
      </div>
      <div id="zone-correction" hidden>
        ${formulaire(it)}
        <div class="boutons"><button class="action btn-principal" id="btn-corriger">💾 Corriger et valider</button></div>
      </div>
      <p style="text-align:center;color:var(--doux);font-size:13px">${faits} relu(s) · ${fileCorrection.length} restant(s)</p>
    </div>`;

  const suivant = () => { fileCorrection.shift(); rendreCorrection(); };
  vueCorrection.querySelector('#btn-juste').onclick = () => { it.statut = 'valide'; it.aVerifier = 'non'; sauver(); suivant(); };
  vueCorrection.querySelector('#btn-passer').onclick = () => { fileCorrection.push(fileCorrection.shift()); rendreCorrection(); };
  vueCorrection.querySelector('#btn-faux').onclick = () => { vueCorrection.querySelector('#zone-correction').hidden = false; };
  vueCorrection.querySelector('#btn-corriger').onclick = (e) => {
    e.preventDefault();
    const maj = lireFormulaire(vueCorrection, it);
    if (!maj) return;
    Object.assign(it, maj, { statut: 'valide', aVerifier: 'non' });
    sauver(); suivant();
  };
}

// ————— mode édition : liste + fiche —————
const vueEdition = document.getElementById('vue-edition');
const dlg = document.getElementById('dlg');
let filtreTexte = '';

function rendreEdition() {
  const visibles = items.filter((i) => !filtreTexte || i.mot.includes(filtreTexte));
  vueEdition.innerHTML = `
    <div class="barre">
      <input type="search" id="ed-recherche" placeholder="Chercher…" value="${filtreTexte}">
      <button class="action btn-principal" id="ed-nouveau">＋ Nouveau mot</button>
    </div>
    <table><thead><tr><th>mot</th><th>découpage</th><th>syll.</th><th>attaque</th><th>fréq.</th><th>statut</th><th></th></tr></thead>
    <tbody>${visibles.map((it, i) => `<tr data-mot="${it.mot}">
      <td><b>${it.mot}</b></td><td>${colore(it.decoupage)}</td><td>${it.syllabesOrales}</td>
      <td>/${it.phonemeAttaque}/</td><td>${it.frequence}</td>
      <td><span class="tag ${it.statut}">${it.statut === 'valide' ? '✓ validé' : 'à relire'}</span></td>
      <td><button class="action btn-neutre btn-suppr" data-mot="${it.mot}" style="padding:4px 10px">🗑</button></td>
    </tr>`).join('')}</tbody></table>`;

  vueEdition.querySelector('#ed-recherche').oninput = (e) => { filtreTexte = e.target.value.toLowerCase(); rendreEdition(); };
  vueEdition.querySelector('#ed-nouveau').onclick = () => ouvrirFiche(null);
  for (const tr of vueEdition.querySelectorAll('tbody tr')) {
    tr.onclick = (e) => {
      if (e.target.closest('.btn-suppr')) return;
      ouvrirFiche(items.find((i) => i.mot === tr.dataset.mot));
    };
  }
  for (const b of vueEdition.querySelectorAll('.btn-suppr')) {
    b.onclick = () => {
      if (!confirm(`Supprimer « ${b.dataset.mot} » ?`)) return;
      items = items.filter((i) => i.mot !== b.dataset.mot);
      for (const i of items) { // nettoyer les distracteurs qui pointaient dessus
        i.distracteursProches = i.distracteursProches.split('|').filter((d) => d && d !== b.dataset.mot).join('|');
      }
      sauver(); rendreEdition();
    };
  }
}

function ouvrirFiche(it) {
  const estNouveau = it === null;
  const base = it ?? { frequence: '2', aVerifier: 'non', competences: '', distracteursProches: '' };
  document.getElementById('dlg-contenu').innerHTML = `
    <h3>${estNouveau ? 'Nouveau mot' : `Modifier « ${base.mot} »`}</h3>
    ${formulaire(base, estNouveau)}
    <div class="boutons">
      <button class="action btn-principal" id="dlg-ok">💾 Enregistrer (repasse « à relire »)</button>
      <button class="action btn-neutre" id="dlg-annuler">Annuler</button>
    </div>`;
  dlg.showModal();
  document.getElementById('dlg-annuler').onclick = () => dlg.close();
  document.getElementById('dlg-ok').onclick = (e) => {
    e.preventDefault();
    const maj = lireFormulaire(dlg, base);
    if (!maj) return;
    if (estNouveau && items.some((i) => i.mot === maj.mot)) { alert('Ce mot existe déjà.'); return; }
    maj.statut = 'a-relire'; // toute création/modification repasse en relecture
    if (estNouveau) items.push(maj); else Object.assign(it, maj);
    dlg.close(); sauver(); rendreEdition(); demarrerCorrection();
  };
}

// ————— onglets —————
const [ongC, ongE] = [document.getElementById('ong-correction'), document.getElementById('ong-edition')];
function basculer(correction) {
  ongC.classList.toggle('actif', correction);
  ongE.classList.toggle('actif', !correction);
  document.getElementById('vue-correction').hidden = !correction;
  vueEdition.hidden = correction;
  if (correction) demarrerCorrection(); else rendreEdition();
}
ongC.onclick = () => basculer(true);
ongE.onclick = () => basculer(false);

etatSauvegarde.textContent = `${items.filter((i) => i.statut === 'valide').length}/${items.length} validés`;
demarrerCorrection();
</script>
</body>
</html>
