# Directives nginx additionnelles du sous-domaine plouma.justhugo.fr (doc 18 §3.1).
# À coller dans Plesk → plouma.justhugo.fr → Apache & nginx Settings →
# « Additional nginx directives » (et cocher le proxy nginx seul, sans Apache).
# Prérequis : /etc/nginx/conf.d/plouma_limit.conf (zone limit_req) + htpasswd (EXPLOITATION.md).

auth_basic "Atelier Plouma";
auth_basic_user_file /etc/nginx/plouma-atelier.htpasswd;

add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# Les endpoints d'écriture : débit limité (la zone est déclarée au niveau http).
location ~ ^/(cadrage/viewer/(comments|estimations)\.php|contenu/banques/save)$ {
    limit_req zone=plouma_ecriture burst=10 nodelay;
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Utilisateur $remote_user;
}

# Tout le reste (statique du viewer/admin/docs).
location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Utilisateur $remote_user;
}
